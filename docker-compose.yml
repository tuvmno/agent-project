networks:
  default:
    name: financeial_report_analysis_network

x-app-env: &app-env
  PYTHONUNBUFFERED: "1"
  POSTGRES_HOST: my_postgres
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY}
  LANGSMITH_TRACING_V2: ${LANGSMITH_TRACING_V2}
  LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  BUCKET_NAME: ${BUCKET_NAME}
  OLLAMA_BASE_URL: http://ollama:11434

# Airflow 공통 설정
x-airflow-common: &x-airflow-common
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "Asia/Seoul"
    AIRFLOW_UID: 50000
    # DB 연결 정보
    POSTGRES_HOST: my_postgres
    POSTGRES_PORT: ${POSTGRES_PORT}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Airflow 계정 정보
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
    # API 키
    GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    # MinIO(S3) 접속 정보
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    BUCKET_NAME: ${BUCKET_NAME}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./pdf_reports:/opt/airflow/pdf_reports

x-app-common: &x-app-common
  environment: *app-env
  volumes:
    - ./:/app
  working_dir: /app

services:
  # 로컬 LLM 모델 실행용
  ollama:
    image: ollama/ollama:latest
    container_name: my_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


  # 데이터베이스
  postgres:
    image: pgvector/pgvector:pg16  # 👈 벡터 DB 기능이 포함된 이미지
    container_name: my_postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_AIRFLOW_DB: ${POSTGRES_AIRFLOW_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 데이터 레이크 (MinIO 추가)
  minio:
    image: minio/minio
    container_name: my_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # API 포트 (코드에서 접속)
      - "9001:9001" # 웹 콘솔 포트 (브라우저 접속)
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    container_name: minio_init
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_NAME: ${BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
        until /usr/bin/mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do
          sleep 2;
        done;
        /usr/bin/mc mb --ignore-existing local/$${BUCKET_NAME};
      "

  # 채팅 로그 저장소
  mongo:
    image: mongo:6.0
    container_name: my_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 캐시
  redis:
    image: redis:7
    container_name: my_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # FastAPI 백엔드
  backend:
    <<: *x-app-common
    build: .
    image: agent-project-app:latest
    container_name: agent_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Streamlit 프론트엔드
  frontend:
    <<: *x-app-common
    image: agent-project-app:latest
    container_name: agent_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      <<: *app-env
      BACKEND_URL: http://backend:8000/ask
    ports:
      - "8501:8501"
    command: python -m streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false

  # Airflow 서비스들
  airflow-webserver:
    <<: *x-airflow-common
    container_name: airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  airflow-scheduler:
    <<: *x-airflow-common
    container_name: airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: scheduler

  airflow-init:
    <<: *x-airflow-common
    container_name: airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Anonymous --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL}
      "

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:
  ollama_data:
